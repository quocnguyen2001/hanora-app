<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#FF6F91" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>hanora — Học từ vựng tiếng Trung</title>
    <meta
      name="description"
      content="Tra cứu, lưu và ôn tập từ vựng tiếng Trung với âm Hán-Việt."
    />
  </head>
  <body>
    <!--
      Áp tùy chỉnh hiển thị TRƯỚC khung hình đầu tiên.

      Không có khối này, chủ đề chỉ được áp trong một effect của React — tức là
      SAU lần paint đầu. Người dùng chọn chế độ tối sẽ thấy một nhịp nền trắng
      lóe lên mỗi lần mở app, và trên máy chậm nhịp đó dài tới vài trăm ms.

      ⚠ Đây là BẢN SAO logic của `applyDisplay()` trong `src/lib/display-theme.ts`.
      Không import được: script này phải chạy trước khi module đầu tiên tải. Sửa
      tên thuộc tính `data-*`, khóa lưu trữ, hay màu thanh trạng thái ở một bên
      thì PHẢI sửa cả bên kia.

      `accent` được LỌC qua bảng bên dưới chứ không dùng thẳng: giá trị này ra
      thẳng thuộc tính `data-accent` và thẳng vào `meta[theme-color]`, nên một
      localStorage bị sửa tay có thể nhét chuỗi bất kỳ vào cả hai chỗ.

      `zustand/persist` bọc state trong `{ state: {...}, version: n }` — phải đọc
      `parsed.state`, không phải object gốc. Toàn bộ nằm trong try/catch: một
      localStorage hỏng hay JSON sai không bao giờ được làm trắng app.
    -->
    <script>
      ;(function () {
        /*
          Màu thanh trạng thái của từng màu chủ đạo ở chế độ SÁNG. Phải khớp
          `ACCENT_META[*].swatch` trong `src/lib/display-theme.ts` — cùng ràng
          buộc chép tay như phần còn lại của khối này.
        */
        var ACCENT_BAR = {
          rose: '#ff6f91',
          tangerine: '#f97a3d',
          honey: '#c9880e',
          mint: '#14a06e',
          sky: '#2f83e0',
          violet: '#8257e6',
        }

        try {
          var raw = window.localStorage.getItem('hanora.display')
          var s = (raw && JSON.parse(raw).state) || {}
          var root = document.documentElement
          var theme = s.theme || 'system'
          var accent = ACCENT_BAR[s.accent] ? s.accent : 'rose'

          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }

          root.dataset.theme = theme
          root.dataset.accent = accent
          root.dataset.font = s.font || 'inter'
          root.dataset.textTone = s.textTone || 'ink'
          root.dataset.motion = s.motion || 'full'
          root.style.setProperty('--font-scale', String(s.fontScale || 1))

          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#16131A' : ACCENT_BAR[accent])
        } catch (error) {
          /* Không có lựa chọn nào lưu, hoặc lưu hỏng → dùng mặc định của CSS. */
        }
      })()
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
