<!--
  Lockup ngang: mark + wordmark. Dùng NGOÀI app — README, tài liệu, ảnh chia sẻ.

  Trong app KHÔNG dùng file này. `AppHeader` và `AuthLayout` ghép
  `<BrandMark />` (SVG inline, ăn `currentColor`, đổi màu theo chủ đề) với chữ
  `hanora` là text HTML thật, nên wordmark dùng đúng font giao diện người dùng
  đã chọn ở màn Hiển thị & chữ. Một file SVG tĩnh không làm được điều đó.

  `<text>` ở đây là CHẤP NHẬN ĐƯỢC, khác hẳn ca chữ 字 đã bị gỡ:

    - 字 cần font CJK. Máy không cài thì ra ô vuông tofu — hỏng hẳn.
    - `hanora` là chữ Latin. Mọi hệ điều hành đều có font Latin, nên tệ nhất là
      wordmark hiện bằng một sans khác — vẫn đọc được, vẫn đúng tên.

  Hai tình huống khác nhau về mức độ hỏng, nên đối xử khác nhau. `favicon.svg`
  và `icon-source.svg` thì tuyệt đối không có `<text>`, vì chúng là icon vuông
  không mang chữ Latin nào.
-->
