<!--
  Icon nguồn cho PWA. Vuông, không chữ Latin, đọc được ở cỡ favicon.
  P18 xuất từ file này ra các cỡ 192/512 và maskable.
  Concept lấy từ showcase: chữ 字 trên nền hồng pastel, kèm cánh hoa anh đào.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="hanora">
  <rect width="512" height="512" rx="112" fill="#FF6F91"/>
  <circle cx="404" cy="112" r="30" fill="#FFF0F4" opacity="0.45"/>
  <circle cx="452" cy="152" r="18" fill="#FFF0F4" opacity="0.35"/>
  <text x="256" y="340" font-family="Noto Sans SC, sans-serif" font-size="272" font-weight="500"
        text-anchor="middle" fill="#FFFFFF">字</text>
</svg>
