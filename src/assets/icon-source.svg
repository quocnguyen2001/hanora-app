<!--
  NGUỒN DUY NHẤT để xuất icon PWA. `scripts/export-icons.mjs` đọc file này.

  KHÔNG có phần tử `<text>` nào, và đó là ràng buộc cứng.

  Bản trước vẽ chữ 字 bằng `<text font-family="Noto Sans SC">`. Font đó đã bị gỡ
  khỏi self-host (Google cắt nó thành 202 lát ~2,26 MB, không subset nào phủ nổi
  từ điển 120k mục), nên chữ được vẽ bằng bất kỳ font CJK nào máy đó có — hoặc ô
  vuông tofu trên máy không cài font CJK. Icon PWA phải giống nhau ở mọi nơi.
  SVG nhúng làm icon cũng không kéo được webfont về, nên "đổi font" không cứu
  được; chỉ có path mới tái lập được.

  Hình: hoa anh đào năm cánh, tái dùng đúng hình học 5 cánh xoay 72° của
  `IllustrationPlaceholder.tsx` để mark và placeholder là một họ.

  Bỏ chữ 字 khỏi mark là có chủ đích: nó không đọc được ở cỡ favicon, và
  `brand.md` liệt "overly complex Chinese ornaments" vào mục Don't. Chữ Hán đã
  là nội dung chính của app rồi, logo không cần nhắc lại.

  Vùng an toàn maskable: nội dung nằm trong đường tròn 80% giữa. Bán kính hoa
  ≈ 7,5 đơn vị × scale 22 = 165px, nằm gọn trong bán kính an toàn 205px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="hanora">
  <rect width="512" height="512" rx="112" fill="#FF6F91" />

  <g transform="translate(256 256) scale(22) translate(-12 -12)">
    <!--
      Một cánh vẽ hướng lên từ tâm (12,12), rồi xoay 72° bốn lần.
      Khuyết chữ V ở đầu cánh là đặc trưng của hoa anh đào thật — nó phân biệt
      mark này với một bông hoa năm cánh chung chung.
    -->
    <g fill="#FFFFFF">
      <path
        d="M12 12.5C10.2 11.3 9.2 9.4 9.6 7.5c.25-1.3.8-2 1.4-2.4L12 6.5l1-1.4c.6.4 1.15 1.1 1.4 2.4.4 1.9-.6 3.8-2.4 5Z"
      />
      <path
        d="M12 12.5C10.2 11.3 9.2 9.4 9.6 7.5c.25-1.3.8-2 1.4-2.4L12 6.5l1-1.4c.6.4 1.15 1.1 1.4 2.4.4 1.9-.6 3.8-2.4 5Z"
        transform="rotate(72 12 12)"
      />
      <path
        d="M12 12.5C10.2 11.3 9.2 9.4 9.6 7.5c.25-1.3.8-2 1.4-2.4L12 6.5l1-1.4c.6.4 1.15 1.1 1.4 2.4.4 1.9-.6 3.8-2.4 5Z"
        transform="rotate(144 12 12)"
      />
      <path
        d="M12 12.5C10.2 11.3 9.2 9.4 9.6 7.5c.25-1.3.8-2 1.4-2.4L12 6.5l1-1.4c.6.4 1.15 1.1 1.4 2.4.4 1.9-.6 3.8-2.4 5Z"
        transform="rotate(216 12 12)"
      />
      <path
        d="M12 12.5C10.2 11.3 9.2 9.4 9.6 7.5c.25-1.3.8-2 1.4-2.4L12 6.5l1-1.4c.6.4 1.15 1.1 1.4 2.4.4 1.9-.6 3.8-2.4 5Z"
        transform="rotate(288 12 12)"
      />
    </g>

    <!-- Nhụy: một chấm ấm giữ mắt lại ở tâm, tránh mark bị "rỗng ruột". -->
    <circle cx="12" cy="12" r="1.6" fill="#FFD3DF" />
  </g>
</svg>
